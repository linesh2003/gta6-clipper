# PRODUCE: every 3 hours — checks the followed channels for NEW streams,
# finds hype moments, renders styled vertical clips, sends them to Telegram.
# (There is no upload step — you post the clips to YouTube yourself.)
name: produce clips

on:
  schedule:
    - cron: "0 */3 * * *"     # every 3 hours; a run with nothing new takes ~2 min
  workflow_dispatch:
    inputs:
      clips:
        description: "How many clips to make this run (blank = config default)"
        required: false
        default: ""

# never run two pipeline jobs at once (they share state/state.json)
concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

permissions:
  contents: write             # commit state back to the repo

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system + python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          # the viral caption font ships with the repo — install it for libass
          mkdir -p ~/.fonts
          cp assets/fonts/*.ttf ~/.fonts/
          fc-cache -f > /dev/null

      - name: Restore whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
          restore-keys: whisper-models-

      - name: Produce clips
        run: |
          COUNT="${{ github.event.inputs.clips }}"
          if [ -z "$COUNT" ]; then COUNT="${{ vars.CLIPS_PER_RUN || 3 }}"; fi
          python -m pipeline.run produce --count "$COUNT"

      - name: Upload clips as artifacts (backup of everything Telegram got)
        if: hashFiles('drafts/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: drafts/*.mp4
          retention-days: 30

      - name: Commit pipeline state
        run: |
          git config user.name "clips-bot"
          git config user.email "actions@clips.local"
          git add state/state.json
          git diff --cached --quiet || git commit -m "state: produced clips (run ${{ github.run_id }})"
          git push
